services:
  # ─── FastAPI Backend Service ──────────────────────────────────────────────────
  backend:
    # Always build from the repository source; do not depend on a mutable :latest image.
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    container_name: enterprise_rag_backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG:-true}
      APP_NAME: ${APP_NAME:-Enterprise RAG}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/enterprise_rag}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-enterprise_docs}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-enterprise-rag-2026-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OAUTH_SECURE_COOKIES: ${OAUTH_SECURE_COOKIES:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - db
      - qdrant
      - redis
    networks:
      - enterprise-rag-network

  # ─── React + Vite Frontend Service (Nginx) ────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend
      args:
        # Empty means same-origin /api requests through Nginx.
        # Set VITE_API_URL when deploying the SPA separately from the API.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost}
    container_name: enterprise_rag_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - enterprise-rag-network

  # ─── PostgreSQL Database Service ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: enterprise_rag_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enterprise-rag-network

  # ─── Qdrant Vector Database Service ──────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - enterprise-rag-network

  # ─── Redis Cache Service ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: enterprise_rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - enterprise-rag-network

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

networks:
  enterprise-rag-network:
    driver: bridge
