services:
  # ─── Ollama LLM Service (LOCAL / GPU-accelerated) ────────────────────────────
  # Uncomment this block when running locally without Ollama Cloud.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: enterprise_rag_ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   restart: unless-stopped
  #   networks:
  #     - enterprise-rag-network

  # ─── One-shot init: pulls qwen2.5:3b (LOCAL only) ────────────────────────────
  # Uncomment together with the ollama service above when running locally.
  # ollama-pull:
  #   image: ollama/ollama:latest
  #   container_name: enterprise_rag_ollama_pull
  #   entrypoint: >
  #     sh -c "
  #       echo 'Waiting for Ollama to be ready...';
  #       until curl -sf http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
  #       echo 'Pulling qwen2.5:3b model...';
  #       ollama pull qwen2.5:3b;
  #       echo 'Model pull complete.';
  #     "
  #   environment:
  #     - OLLAMA_HOST=http://ollama:11434
  #   depends_on:
  #     - ollama
  #   networks:
  #     - enterprise-rag-network
  #   restart: "no"

  # ─── FastAPI Backend Service ──────────────────────────────────────────────────
  backend:
    image: ajup738/neroxaai-backend:latest
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    container_name: enterprise_rag_backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - APP_NAME=Enterprise RAG
      - APP_VERSION=0.1.0
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/enterprise_rag}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=enterprise_docs
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      # ── Ollama Cloud (production) ──────────────────────────────────────────────
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://api.ollama.com}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      # ── Uncomment the line below and comment the two above for local Ollama ────
      # - OLLAMA_BASE_URL=http://ollama:11434
      # - OLLAMA_MODEL=qwen2.5:3b
      # (no OLLAMA_API_KEY needed for local)
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - EMBEDDING_DIMENSION=384
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-enterprise-rag-2026}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ORIGINS=http://localhost,http://localhost:80
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - db
      - qdrant
      - redis
      # - ollama   # Uncomment when using local Ollama container
    volumes:
      - ../backend:/app/backend
    networks:
      - enterprise-rag-network

  # ─── React + Vite Frontend Service (Nginx) ────────────────────────────────────
  frontend:
    image: ajup738/neroxaai-frontend:latest
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend
    container_name: enterprise_rag_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - enterprise-rag-network

  # ─── PostgreSQL Database Service ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: enterprise_rag_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enterprise-rag-network

  # ─── Qdrant Vector Database Service ──────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - enterprise-rag-network

  # ─── Redis Cache Service ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: enterprise_rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - enterprise-rag-network

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  # ollama_data:   # Uncomment when using local Ollama container

networks:
  enterprise-rag-network:
    driver: bridge
