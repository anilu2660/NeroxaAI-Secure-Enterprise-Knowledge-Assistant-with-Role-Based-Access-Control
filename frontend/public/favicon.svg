<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9b51e0"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Outer Glowing Shield -->
  <path d="M 256 90 L 390 140 C 390 280 320 375 256 420 C 192 375 122 280 122 140 Z" 
        fill="none" 
        stroke="url(#cyanPurple)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Cyber Cube/Node -->
  <polygon points="256,180 320,215 320,285 256,320 192,285 192,215" 
           fill="none" 
           stroke="url(#accentGrad)" 
           stroke-width="10" 
           stroke-linejoin="round"/>
  
  <line x1="256" y1="180" x2="256" y2="320" stroke="url(#accentGrad)" stroke-width="8"/>
  <line x1="256" y1="250" x2="320" y2="215" stroke="url(#accentGrad)" stroke-width="8"/>
  <line x1="256" y1="250" x2="192" y2="215" stroke="url(#accentGrad)" stroke-width="8"/>

  <!-- Dynamic Arrow / N geometric vector -->
  <path d="M 180 340 L 256 220 L 332 340 L 332 200 L 370 170" 
        fill="none" 
        stroke="#00f2fe" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Arrow Head -->
  <polygon points="370,170 345,175 365,195" fill="#00f2fe"/>
</svg>
