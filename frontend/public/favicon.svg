<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Left Pillar Gradient -->
    <linearGradient id="fav-grad-left" x1="15" y1="15" x2="35" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Diagonal Slash Gradient -->
    <linearGradient id="fav-grad-diag" x1="15" y1="15" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Right Pillar Gradient -->
    <linearGradient id="fav-grad-right" x1="75" y1="45" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="fav-shield-grad" x1="68" y1="12" x2="98" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shield Stroke -->
    <linearGradient id="fav-shield-stroke" x1="68" y1="12" x2="98" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Left Vertical Element -->
  <path d="M16 20L38 42V98L16 104V20Z" fill="url(#fav-grad-left)" />

  <!-- Main Diagonal Slash -->
  <path d="M16 16L102 104H78L16 42V16Z" fill="url(#fav-grad-diag)" />

  <!-- Right Vertical Pillar -->
  <path d="M80 48L102 70V104L80 82V48Z" fill="url(#fav-grad-right)" />

  <!-- Highlight Line -->
  <path d="M16 16L102 104" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Top-Right Security Shield & Lock Badge -->
  <g>
    <!-- Shield Base -->
    <path
      d="M84 8C84 8 94 11 104 8V27C104 38 94 48 84 52C74 48 64 38 64 27V8C74 11 84 8 84 8Z"
      fill="url(#fav-shield-grad)"
      stroke="url(#fav-shield-stroke)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Shield Glow -->
    <path
      d="M84 11C84 11 92 13.5 100 11V26C100 34 92 43 84 47C76 43 68 34 68 26V11C76 13.5 84 11 84 11Z"
      fill="rgba(37, 99, 235, 0.3)"
    />

    <!-- Lock Shackle -->
    <path
      d="M80 23V20C80 17.7909 81.7909 16 84 16C86.2091 16 88 17.7909 88 20V23"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linecap="round"
    />

    <!-- Lock Body -->
    <rect x="76" y="23" width="16" height="13" rx="3" fill="#ffffff" />

    <!-- Lock Keyhole -->
    <circle cx="84" cy="28.5" r="1.5" fill="#0f172a" />
    <path d="M84 30V33" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
