<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexora AI — Secure Enterprise Knowledge & AI</title>
    <meta name="description" content="Secure enterprise AI built around your organization's knowledge, with RAG, RBAC and local AI models." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=nexora_v3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=nexora_v3" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=nexora_v3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=nexora_v3" />
    <link rel="shortcut icon" href="/favicon.ico?v=nexora_v3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("neroxa_theme");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("sunny");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("sunny");
          }
        } catch (e) {
          document.documentElement.classList.add("sunny");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
